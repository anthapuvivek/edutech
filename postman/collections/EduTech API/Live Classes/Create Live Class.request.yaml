$kind: http-request
name: Create Live Class
url: '{{baseUrl}}/api/teacher/live-classes'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "title": "",
      "courseId": "",
      "scheduledAt": "",
      "duration": 60
    }
