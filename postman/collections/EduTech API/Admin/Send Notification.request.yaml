$kind: http-request
name: Send Notification
url: '{{baseUrl}}/api/admin/communication/notifications'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "title": "",
      "message": "",
      "recipients": []
    }
