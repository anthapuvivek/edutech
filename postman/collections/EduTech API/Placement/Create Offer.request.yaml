$kind: http-request
name: Create Offer
url: '{{baseUrl}}/api/placement/offers'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "studentId": "",
      "companyId": "",
      "ctc": "",
      "joiningDate": ""
    }
