$kind: http-example
name: '401 Invalid Credentials'
request:
  body:
    type: json
    content: |-
      {
        "email": "student@learntrix.com",
        "password": "wrongpassword"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": {
          "code": "AUTH_INVALID_CREDENTIALS",
          "message": "Invalid email or password"
        }
      }
