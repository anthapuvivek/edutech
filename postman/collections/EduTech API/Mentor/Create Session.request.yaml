$kind: http-request
name: Create Session
url: '{{baseUrl}}/api/mentor/sessions'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "studentId": "",
      "scheduledAt": "",
      "duration": 60,
      "notes": ""
    }
