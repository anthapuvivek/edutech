spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learntrix}
    username: ${DB_USERNAME:postgres}
    password: "${DB_PASSWORD:1}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

# Profile properties outrank application.yml, so these have to carry the same ${ENV}
# placeholders - hardcoding them here silently discarded JWT_SECRET from backend/.env and
# signed every dev token with a secret committed to the repository.
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits-long-string-here}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:2592000000}

logging:
  level:
    com.learntrix: DEBUG

# Redis is optional for the current local backend scaffold. Keep the database
# health signal authoritative until Redis-backed features are introduced.
management:
  health:
    redis:
      enabled: false
