spring:
  datasource:
    url: jdbc:h2:mem:edtech_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  mail:
    host: ""

app:
  jwt:
    secret: test-secret-key-for-testing-only-min-256-bits

logging:
  level:
    root: WARN
    com.learntrix: INFO
