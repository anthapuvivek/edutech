spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      # Defaults required: no application code uses Redis or Kafka yet, so a deployment
      # that does not run them must still boot. Without a default, ${REDIS_PORT} reached
      # the binder as a literal string and production died with
      # "failed to convert java.lang.String to int". Set the env vars to point at real
      # infrastructure when a feature starts depending on it.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Redis is not on any request path today. Leaving its health indicator on would report the
# whole application DOWN to a load balancer over a dependency nothing uses.
management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.learntrix: INFO

server:
  error:
    include-stacktrace: never

# Video / recording storage. VideoStorageConfig selects the implementation from
# learntrix.video.storage; both LocalVideoStorageService and S3VideoStorageService
# already exist in the codebase. An ECS/Fargate container filesystem is ephemeral,
# so local disk loses every upload on redeploy - S3 is the durable choice on AWS.
learntrix:
  video:
    storage: ${VIDEO_STORAGE:s3}

aws:
  s3:
    # No default on purpose: booting against the wrong bucket is worse than failing
    # fast, and this matches how DB_URL / JWT_SECRET are treated above.
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:us-east-1}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:}
