server:
  port: 8081

spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:backend/.env[.properties]"
  profiles:
    active: dev
  application:
    name: edtech-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learntrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    default-encoding: UTF-8
    from: ${MAIL_FROM:${MAIL_USERNAME:${SPRING_MAIL_USERNAME:anthapuvivekananda@gmail.com}}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  client-url: ${APP_CLIENT_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:learntrix-secret-key-32chars-dev-only}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    # Lifetime issued when the client sends "remember me". The signed token and the
    # expiresAt returned to the client are both derived from this single value.
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:2592000000}
  cors:
    # Vite picks its dev port at startup; every port the dev server may land on has to be
    # listed or the browser fails preflight and the app looks like a backend outage.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173}

logging:
  level:
    root: INFO
