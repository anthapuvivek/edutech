server:
  port: 8081

spring:
  # Spring Boot does not read .env files on its own. Importing it here means the database,
  # SMTP and JWT settings reach the app however it is launched - backend/run.ps1, a bare
  # `mvn spring-boot:run`, or an IDE run configuration - instead of only when the launcher
  # happens to have exported them. Marked optional so a machine without the file (CI, a
  # container using real environment variables) still starts. Real environment variables
  # outrank an imported file, so run.ps1 and container env still win.
  config:
    import: optional:file:./.env[.properties]
  profiles:
    active: dev
  application:
    name: edtech-backend

  mail:
    # Set MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD in backend/.env (see .env.example).
    # Without a host Spring Boot creates no JavaMailSender and nothing is ever sent.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        transport:
          protocol: smtp

  data:
    redis:
      repositories:
        # Every repository in this project is a Spring Data JPA repository backed by
        # PostgreSQL. With spring-boot-starter-data-redis on the classpath, Redis also
        # scanned them and logged 33 "Could not safely identify store assignment" lines at
        # every startup. Turning the Redis repository scan off silences that without
        # touching the Redis connection factory, which stays available for future use.
        enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learntrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Class recordings go through /api/recordings/upload-local in local storage mode.
      # Spring Boot defaults to 1MB per file and 10MB per request, so every real recording
      # failed with MaxUploadSizeExceededException. 2GB matches the limit the teacher
      # upload form enforces client-side. file-size-threshold 0 keeps the upload on disk
      # instead of in heap, so a large file does not have to fit in memory.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:2GB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:2GB}
      file-size-threshold: 0

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # The mail indicator opens an SMTP connection on every health check and reports DOWN
    # whenever credentials are absent, which would drag the whole app's status down over an
    # integration that is configured separately. GET /api/admin/mail/status is the
    # authoritative, far more informative check for outbound email.
    mail:
      enabled: false

app:
  # Origin used to build activation / password-reset links inside outgoing emails.
  # Must match where the frontend actually runs.
  client-url: ${APP_CLIENT_URL:http://localhost:8080}
  mail:
    # Address subscribers see in the From header. Defaults to the SMTP account.
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@learntrix.com}}
    from-name: ${MAIL_FROM_NAME:LearntriX Platform}
    # When true a send failure is reported to the caller as FAILED instead of
    # being swallowed, so the admin UI can never claim a mail was delivered.
    fail-loudly: ${MAIL_FAIL_LOUDLY:true}
  jwt:
    secret: ${JWT_SECRET:learntrix-secret-key-32chars-dev-only}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    # Lifetime issued when the client sends "remember me". The signed token and the
    # expiresAt returned to the client are both derived from this single value.
    remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:2592000000}
  cors:
    # Vite picks its dev port at startup; every port the dev server may land on has to be
    # listed or the browser fails preflight and the app looks like a backend outage.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173}

# ---------------------------------------------------------------------------
# Judge0 - sandboxed execution of student code
# ---------------------------------------------------------------------------
# Student code is NEVER run inside this JVM. It is forwarded to Judge0, which
# executes it in an isolated container under its own CPU and memory limits.
#
# The API key stays server-side: React talks to LearntriX, LearntriX talks to
# Judge0. Leaving url blank is a supported state - Run and Submit then return a
# clear "not configured" message instead of failing obscurely.
judge0:
  url: ${JUDGE0_URL:}
  api-key: ${JUDGE0_API_KEY:}
  api-host: ${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}

# ---------------------------------------------------------------------------
# Google Gemini - AI Question Assistant (teacher-only)
# ---------------------------------------------------------------------------
# The key is read from the environment and stays server-side: it is never sent
# to the browser, never logged, and never included in an API response.
#
# Leaving api-key blank is a supported state - the app still starts, and the
# assistant returns a clear "not configured" error instead of failing obscurely.
#
# model: verify against the live ListModels endpoint before changing. Newly
# released models are frequently overloaded (HTTP 503) even when they exist.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3-flash-preview}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:90}

# ---------------------------------------------------------------------------
# Code execution provider for Coding Practice
# ---------------------------------------------------------------------------
# Which sandbox runs student code: judge0 (default) or jdoodle. Exactly one
# CodeExecutionClient bean is created, so switching is a one-line change and
# nothing above the execution package is aware of the difference.
#
# Student code is NEVER executed inside this JVM under either provider.
execution:
  provider: ${EXECUTION_PROVIDER:judge0}

# JDoodle. Credentials go in the request body (their API takes no auth header),
# so they stay server-side and are never sent to the browser.
#
# versionIndex is a POSITION in JDoodle's version list, not a version number, and
# positions shift as they add releases. 0 is the safe floor; raise it if you need a
# newer compiler - check their languages page for the current position.
jdoodle:
  client-id: ${JDOODLE_CLIENT_ID:}
  client-secret: ${JDOODLE_CLIENT_SECRET:}
  url: ${JDOODLE_URL:https://api.jdoodle.com/v1/execute}
  # Optional per-language overrides. Each language has its OWN valid range
  # (java [0..6], cpp17 [0..3], typescript [0..1]), so there is no single global
  # index. Sensible newest-version defaults live in JDoodleExecutionClient;
  # uncomment and pin one here only if a default stops working.
  # version-index:
  #   java: "6"
  #   cpp: "3"

logging:
  level:
    root: INFO
