version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: edtech-postgres
    environment:
      POSTGRES_DB: edtech_dev
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: edtech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech -d edtech_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edtech-network

  redis:
    image: redis:7-alpine
    container_name: edtech-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edtech-network

  kafka:
    image: apache/kafka:3.8.1
    container_name: edtech-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edtech-network

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: edtech-kafka-ui
    ports:
      - "9093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - edtech-network

  app:
    build:
      context: .
    container_name: edtech-backend-app
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/edtech_dev
      - DB_USERNAME=edtech
      - DB_PASSWORD=edtech
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - edtech-network

  # ---------------------------------------------------------------------------
  # Judge0 - sandboxed execution of student code
  # ---------------------------------------------------------------------------
  # Student code is NEVER run inside the Spring Boot JVM. It is forwarded here and
  # executed in an isolated container under its own CPU and memory limits.
  #
  # Judge0 needs its own Postgres and Redis; it does not share the app's, because a
  # sandbox escape must not reach application data.
  #
  # To use: docker compose up -d judge0-server judge0-workers
  # then set JUDGE0_URL=http://localhost:2358 in backend/.env (no API key needed).
  judge0-db:
    image: postgres:16-alpine
    container_name: edtech-judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    networks:
      - edtech-network

  judge0-redis:
    image: redis:7-alpine
    container_name: edtech-judge0-redis
    command: ["redis-server", "--appendonly", "no"]
    networks:
      - edtech-network

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: edtech-judge0-server
    # privileged is required: Judge0 uses cgroups and namespaces to isolate each
    # submission. This is why it runs in its own container rather than in the app.
    privileged: true
    ports:
      - "2358:2358"
    environment: &judge0-env
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      REDIS_HOST: judge0-redis
      # Ceilings applied to every submission, so one program cannot starve the judge.
      MAX_CPU_TIME_LIMIT: 10
      MAX_WALL_TIME_LIMIT: 20
      MAX_MEMORY_LIMIT: 512000
      ENABLE_WAIT_RESULT: "true"
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - edtech-network

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: edtech-judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    environment: *judge0-env
    depends_on:
      - judge0-server
    networks:
      - edtech-network

networks:
  edtech-network:
    driver: bridge

volumes:
  postgres-data:
  judge0-db-data:
